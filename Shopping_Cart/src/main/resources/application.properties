### 1. Spring Application Settings ###
# The application name
spring.application.name=SHOPPING-CART-SERVICE
# Port for the Shopping Cart Service
server.port=8082

### 2. MySQL Database Configuration ###
# JDBC URL to your cartdb database
spring.datasource.url=jdbc:mysql://localhost:3306/cartdb?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=3Ry@gnltr
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Explicitly disable Eureka Client registration and discovery features
eureka.client.enabled=false
eureka.client.register-with-eureka=false
### 3. JPA/Hibernate Configuration ###
# Automatically creates/updates tables
spring.jpa.hibernate.ddl-auto=update
# Log the SQL statements
spring.jpa.show-sql=true
# Format the logged SQL statements (for readability)
spring.jpa.properties.hibernate.format_sql=true

### 4. Inter-Service Communication (WebClient) ###
# Base URL for the Product Catalog Service (used in WebClientConfig)
product-catalog.url=http://localhost:8081
# 7. Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

### 5. Resilience4j Circuit Breaker Configuration ###
# Configuration for the circuit breaker instance named 'productCatalogService'
resilience4j.circuitbreaker.instances.productCatalogService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productCatalogService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productCatalogService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productCatalogService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productCatalogService.permittedNumberOfCallsInHalfOpenState=3
