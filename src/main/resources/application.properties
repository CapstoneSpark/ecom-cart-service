### 1. Spring Application Settings ###
# The application name
spring.application.name=SHOPPING-CART-SERVICE
# Port for the Shopping Cart Service
server.port=8083



# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/orders?useSSL=false&serverTimezone=UTC
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION}

# External services
product.service.url=
payment.service.url=

orders.idempotency.enabled=true

logging.level.com.example.orderservice=DEBUG
